; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter, extra scripting
;   Upload options: custom port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Test options: test framework, filter, transport
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:raspberrypi_3b]
platform = linux_arm
board = raspberrypi_3b

; Upload configuration (used for both upload and test by default)
upload_protocol = scp
upload_port = pi@raspberrypi.local:/tmp/program

; SSH authentication (optional - uses SSH agent/config by default)
; upload_ssh_port = 22
; upload_ssh_key = ~/.ssh/id_rsa

; Test configuration
test_transport = ssh
; test_port defaults to upload_port if not specified
; test_port = pi@raspberrypi.local:/tmp/test_program

; Test options
test_build_src = yes  ; Include src/ files in test builds
test_filter = test_*  ; Run all tests matching pattern

; Enable verbose output for debugging
; test_verbose = true

[env:orangepi_zero]
platform = linux_arm
board = orangepi_zero

; Upload configuration
upload_protocol = scp
upload_port = root@orangepi:/tmp/program

; Test configuration
test_transport = ssh

; CI/CD Example: Use environment variables for credentials
; This is useful for GitHub Actions, GitLab CI, etc.
; upload_port = ${env.REMOTE_HOST}:/tmp/program
; upload_ssh_key = ${env.SSH_KEY_PATH}
