; PlatformIO Project Configuration File
;
; PWM Servo Control Example using lgpio framework with PWM HAL
;
; This example demonstrates servo motor position control using hardware PWM
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:raspberrypi_3b]
platform = linux_arm
framework = lgpio
board = raspberrypi_3b

[env:raspberrypi_4b]
platform = linux_arm
framework = lgpio
board = raspberrypi_4b

[env:raspberrypi_400]
platform = linux_arm
framework = lgpio
board = raspberrypi_400

[env:raspberrypi_cm4]
platform = linux_arm
framework = lgpio
board = raspberrypi_cm4

[env:raspberrypi_zero2w]
platform = linux_arm
framework = lgpio
board = raspberrypi_zero2w

[env:raspberrypi_5_64bit]
platform = linux_arm
board = raspberrypi_5
framework = lgpio
board_build.arch = aarch64

; ============================================================================
; Upload Examples - Automated Deployment to Remote Targets
; ============================================================================

[env:raspberrypi_4b_upload]
platform = linux_arm
board = raspberrypi_4b
framework = lgpio
upload_protocol = scp
upload_port = pi@raspberrypi.local:/home/pi/lgpio-pwm-servo

[env:raspberrypi_5_upload]
platform = linux_arm
board = raspberrypi_5
framework = lgpio
upload_protocol = rsync
upload_port = pi@raspberrypi.local:/home/pi/lgpio-pwm-servo
upload_flags = -avz --progress
