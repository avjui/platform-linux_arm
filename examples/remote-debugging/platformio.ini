; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter, extra scripting
;   Upload options: custom port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Debug options: debug tool and server configuration
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================================================================
; EXAMPLE 1: Remote Debugging via SSH (Recommended)
; ============================================================================
; This is the standard workflow for debugging ARM Linux applications.
; Uses gdbserver on the target, connected via SSH tunnel.
;
; Prerequisites:
;   1. SSH key authentication configured (ssh-copy-id pi@raspberrypi.local)
;   2. gdbserver installed on target (usually pre-installed on Raspberry Pi OS)
;   3. Cross-compilation toolchain with GDB installed on host
;
; Workflow:
;   1. Build: pio run
;   2. Upload: pio run --target upload
;   3. Debug: pio debug
;
[env:pi4_ssh_debug]
platform = linux_arm
board = raspberrypi_4b

; Build configuration
build_flags =
    -O0           ; No optimization for debugging
    -g3           ; Maximum debug information
    -ggdb         ; GDB-specific debug info

; Upload configuration (required for debug)
upload_protocol = scp
upload_port = pi@raspberrypi.local:/home/pi/debug_example

; Debug configuration
debug_tool = gdbserver-ssh
debug_port = pi@raspberrypi.local

; Optional: Custom SSH port
; debug_ssh_port = 22

; Optional: SSH key file
; debug_ssh_key = ~/.ssh/id_ed25519

; Optional: Custom gdbserver path on target
; debug_server = /usr/bin/gdbserver

; Optional: Custom GDB initialization commands
; debug_init_cmds =
;     set print pretty on
;     set pagination off


; ============================================================================
; EXAMPLE 2: Remote Debugging with Custom SSH Port
; ============================================================================
; For targets using non-standard SSH ports
;
[env:pi4_custom_port]
platform = linux_arm
board = raspberrypi_4b
build_flags = -O0 -g3 -ggdb

upload_protocol = scp
upload_port = pi@192.168.1.100:/home/pi/debug_example
upload_ssh_port = 2222
upload_ssh_key = ~/.ssh/pi_key

debug_tool = gdbserver-ssh
debug_port = pi@192.168.1.100
debug_ssh_port = 2222
debug_ssh_key = ~/.ssh/pi_key


; ============================================================================
; EXAMPLE 3: Direct GDB Remote Connection (Manual Setup)
; ============================================================================
; For advanced users who want to manually start gdbserver.
; This mode requires you to start gdbserver on the target first:
;   ssh pi@raspberrypi.local
;   gdbserver :2345 /home/pi/debug_example
;
[env:pi4_manual_gdbserver]
platform = linux_arm
board = raspberrypi_4b
build_flags = -O0 -g3 -ggdb

upload_protocol = scp
upload_port = pi@raspberrypi.local:/home/pi/debug_example

debug_tool = gdb-remote
debug_port = raspberrypi.local:2345


; ============================================================================
; EXAMPLE 4: Raspberry Pi 5 (64-bit) Debugging
; ============================================================================
; Pi 5 requires 64-bit toolchain and GDB
;
[env:pi5_debug]
platform = linux_arm
board = raspberrypi_5
board_build.arch = aarch64  ; Use 64-bit toolchain

build_flags = -O0 -g3 -ggdb

upload_protocol = scp
upload_port = pi@raspberrypi5.local:/home/pi/debug_example

debug_tool = gdbserver-ssh
debug_port = pi@raspberrypi5.local


; ============================================================================
; EXAMPLE 5: Multiple Target Environments
; ============================================================================
; Debug on different devices by switching environments
;
[env:pi_dev_debug]
platform = linux_arm
board = raspberrypi_4b
build_flags = -O0 -g3 -ggdb
upload_protocol = scp
upload_port = pi@pi-dev.local:/home/pi/debug_example
debug_tool = gdbserver-ssh
debug_port = pi@pi-dev.local

[env:pi_staging_debug]
platform = linux_arm
board = raspberrypi_4b
build_flags = -O0 -g3 -ggdb
upload_protocol = scp
upload_port = pi@pi-staging.local:/home/pi/debug_example
debug_tool = gdbserver-ssh
debug_port = pi@pi-staging.local


; ============================================================================
; EXAMPLE 6: Orange Pi Zero Debugging
; ============================================================================
[env:orangepi_debug]
platform = linux_arm
board = orangepi_zero
build_flags = -O0 -g3 -ggdb

upload_protocol = scp
upload_port = orangepi@orangepi.local:/home/orangepi/debug_example

debug_tool = gdbserver-ssh
debug_port = orangepi@orangepi.local


; ============================================================================
; EXAMPLE 7: Production Build (No Debug Symbols)
; ============================================================================
; For comparison: production build without debug support
;
[env:pi4_release]
platform = linux_arm
board = raspberrypi_4b
build_flags =
    -O2           ; Optimize for performance
    -DNDEBUG      ; Disable assertions

upload_protocol = scp
upload_port = pi@raspberrypi.local:/home/pi/debug_example
