; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter, extra scripting
;   Upload options: custom port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================================================================
; EXAMPLE 1: SCP Upload with SSH Key Authentication (Recommended)
; ============================================================================
; This is the most common and secure deployment method.
; Uses SSH key authentication (no password prompts).
;
; Setup:
;   1. Generate SSH key: ssh-keygen -t ed25519 -C "platformio@pi"
;   2. Copy to Pi: ssh-copy-id pi@raspberrypi.local
;   3. Test: ssh pi@raspberrypi.local
;
; Usage:
;   pio run --target upload
;
[env:pi4_scp]
platform = linux_arm
board = raspberrypi_4b
framework = lgpio

; Upload configuration
upload_protocol = scp
upload_port = pi@raspberrypi.local:/home/pi/myapp

; Optional: Specify custom SSH port (default: 22)
; upload_ssh_port = 2222

; Optional: Specify SSH key file (default: uses ssh-agent)
; upload_ssh_key = ~/.ssh/id_ed25519

; Optional: Run the program after upload
; upload_run_after = true

; Optional: Custom command to run (default: runs the uploaded binary)
; upload_run_command = sudo /home/pi/myapp


; ============================================================================
; EXAMPLE 2: Rsync Upload (Faster for Repeated Deployments)
; ============================================================================
; Rsync only transfers changed parts of the file, making it faster for
; repeated uploads of large binaries.
;
[env:pi4_rsync]
platform = linux_arm
board = raspberrypi_4b
framework = lgpio

upload_protocol = rsync
upload_port = pi@raspberrypi.local:/home/pi/myapp

; Optional: Rsync flags (default: -avz = archive, verbose, compress)
; upload_flags = -avz --progress

; Optional: Run after upload
; upload_run_after = true


; ============================================================================
; EXAMPLE 3: SSH Upload (Alternative Method)
; ============================================================================
; Uses SSH with piped input. Less common but works everywhere SSH works.
;
[env:pi4_ssh]
platform = linux_arm
board = raspberrypi_4b
framework = lgpio

upload_protocol = ssh
upload_port = pi@raspberrypi.local:/home/pi/myapp


; ============================================================================
; EXAMPLE 4: Multiple Target Configurations
; ============================================================================
; Deploy to different devices by switching environments
;
[env:pi_dev]
platform = linux_arm
board = raspberrypi_4b
framework = lgpio
upload_protocol = scp
upload_port = pi@pi-dev.local:/home/pi/myapp

[env:pi_staging]
platform = linux_arm
board = raspberrypi_4b
framework = lgpio
upload_protocol = scp
upload_port = pi@pi-staging.local:/home/pi/myapp

[env:pi_production]
platform = linux_arm
board = raspberrypi_4b
framework = lgpio
upload_protocol = scp
upload_port = pi@pi-production.local:/opt/myapp/bin/program


; ============================================================================
; EXAMPLE 5: Orange Pi with Custom SSH Port
; ============================================================================
[env:orangepi]
platform = linux_arm
board = orangepi_zero
framework = lgpio
upload_protocol = scp
upload_port = orangepi@192.168.1.100:/home/orangepi/myapp
upload_ssh_port = 2222
upload_ssh_key = ~/.ssh/orangepi_key


; ============================================================================
; EXAMPLE 6: Upload and Run with Custom Command
; ============================================================================
; Automatically run the program after upload, optionally with sudo
;
[env:pi_autorun]
platform = linux_arm
board = raspberrypi_4b
framework = lgpio
upload_protocol = scp
upload_port = pi@raspberrypi.local:/home/pi/myapp
upload_run_after = true

; Run with sudo (useful for GPIO access)
upload_run_command = sudo /home/pi/myapp


; ============================================================================
; EXAMPLE 7: Manual Upload (Default - Shows Instructions)
; ============================================================================
; If upload_protocol is not specified or set to "manual", PlatformIO will
; build the binary and show manual upload instructions.
;
[env:manual]
platform = linux_arm
board = raspberrypi_4b
framework = lgpio
; upload_protocol = manual  ; This is the default


; ============================================================================
; EXAMPLE 8: Simplified Configuration (Most Common)
; ============================================================================
; For most users, this simple configuration is all you need:
;
[env:default]
platform = linux_arm
board = raspberrypi_4b
framework = lgpio
upload_protocol = scp
upload_port = pi@raspberrypi.local:/home/pi/myapp
