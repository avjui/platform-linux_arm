; PlatformIO Project Configuration File
;
; PWM LED Fade Example using lgpio framework with PWM HAL
;
; This example demonstrates hardware PWM control for smooth LED fading
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:raspberrypi_3b]
platform = linux_arm
framework = lgpio
board = raspberrypi_3b

[env:raspberrypi_4b]
platform = linux_arm
framework = lgpio
board = raspberrypi_4b

[env:raspberrypi_400]
platform = linux_arm
framework = lgpio
board = raspberrypi_400

[env:raspberrypi_cm4]
platform = linux_arm
framework = lgpio
board = raspberrypi_cm4

[env:raspberrypi_zero2w]
platform = linux_arm
framework = lgpio
board = raspberrypi_zero2w

[env:raspberrypi_5_64bit]
platform = linux_arm
board = raspberrypi_5
framework = lgpio
board_build.arch = aarch64

; ============================================================================
; Upload Examples - Automated Deployment to Remote Targets
; ============================================================================
; These examples show how to use the upload functionality to automatically
; deploy your compiled binary to a remote Raspberry Pi.
;
; Quick start:
; 1. Setup SSH key: ssh-copy-id pi@raspberrypi.local
; 2. Build and upload: pio run -e raspberrypi_4b_upload -t upload
;
; See docs/UPLOAD.md for complete documentation

[env:raspberrypi_4b_upload]
platform = linux_arm
board = raspberrypi_4b
framework = lgpio

; SCP upload (recommended)
upload_protocol = scp
upload_port = pi@raspberrypi.local:/home/pi/lgpio-pwm-fade

; Optional: Uncomment to run after upload (requires sudo for PWM access)
; upload_run_after = true
; upload_run_command = sudo /home/pi/lgpio-pwm-fade

[env:raspberrypi_5_upload]
platform = linux_arm
board = raspberrypi_5
framework = lgpio

; Rsync upload (faster for repeated deployments)
upload_protocol = rsync
upload_port = pi@raspberrypi.local:/home/pi/lgpio-pwm-fade
upload_flags = -avz --progress
