[pytest]
# Pytest configuration for platform-linux_arm

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    --showlocals
    # Display summary of all test outcomes
    -ra
    # Enable strict markers (fail on unknown markers)
    --strict-markers
    # Show warnings
    -W default
    # Coverage options (when pytest-cov is installed)
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    # Exclude venv and build directories from coverage
    --cov-config=.coveragerc

# Markers for categorizing tests
markers =
    unit: Unit tests for individual functions/classes
    integration: Integration tests involving multiple components
    slow: Tests that take significant time to run

# Minimum Python version
minversion = 3.7
